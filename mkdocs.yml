site_name: Cointoss
site_description: Crypto coin portfolio tracker and research platform
site_url: https://walnutgeek.github.io/cointoss/
repo_url: https://github.com/walnutgeek/cointoss
repo_name: walnutgeek/cointoss

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            members_order: source
            docstring_style: google

markdown_extensions:
  - pycon
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - toc:
      permalink: true

nav:
  - Home: index.md
  - API Reference:
      - cointoss: reference/core.md
      - cointoss.models: reference/models.md
      - cointoss.sources: reference/sources.md
      - cointoss.pipeline: reference/pipeline.md
      - cointoss.server: reference/server.md
