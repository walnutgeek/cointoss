site_name: Cointoss
site_description: Crypto coin portfolio tracker and research platform
site_url: https://walnutgeek.github.io/cointoss/
repo_url: https://github.com/walnutgeek/cointoss
repo_name: walnutgeek/cointoss

theme:
  name: material
  # No Google Fonts request: the site uses the system font stack.
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            members_order: source
            docstring_style: google

markdown_extensions:
  - pycon
  # The Glossary page includes CONTEXT.md from the repo root, so it is not duplicated in docs/.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - toc:
      permalink: true

exclude_docs: |
  /agents/

not_in_nav: |
  /release_notes/v*.md

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/walnutgeek/cointoss

copyright: <a href="https://walnutgeek.github.io/cointoss/privacy/">Privacy</a>

nav:
  - Home: index.md
  - Design:
      - Glossary: glossary.md
      - Road map: road-map.md
      - Decisions:
          - "0001 Unified Instrument and Trade as SoR": adr/0001-unified-instrument-and-trade-sor.md
          - "0002 Exposure Matrix and Universe as Series": adr/0002-exposure-matrix-and-universe-as-time-series.md
          - "0003 Lythonic value types, Series wrappers": adr/0003-lythonic-value-types-with-series-wrappers.md
          - "0004 Instrument identity: slug and FIGI": adr/0004-instrument-identity-slug-and-figi.md
          - "0005 Covariance is declared": adr/0005-covariance-is-declared-not-recomputed.md
          - "0006 Cache universes by name": adr/0006-cache-universes-by-name-not-by-contents.md
          - "0007 Universe Definition vs membership": adr/0007-universe-definition-separate-from-evaluated-membership.md
          - "0008 Rows, not blobs": adr/0008-rows-not-blobs-value-types-as-projections.md
          - "0009 Price storage: source-keyed bars": adr/0009-price-storage-source-keyed-bars.md
          - "0010 Datasets read API": adr/0010-datasets-generic-long-framedata-read-api.md
  - API Reference:
      - Domain:
          - cointoss.instrument: reference/instrument.md
          - cointoss.series: reference/series.md
          - cointoss.universe: reference/universe.md
          - cointoss.prices: reference/prices.md
          - cointoss.risk: reference/risk.md
      - Storage:
          - cointoss.store: reference/store.md
          - cointoss.backup: reference/backup.md
      - Ingest:
          - cointoss.ingest: reference/ingest.md
          - cointoss.sources: reference/sources/index.md
          - cointoss.sources.coingecko: reference/sources/coingecko.md
          - cointoss.sources.openfigi: reference/sources/openfigi.md
          - cointoss.sources.yahoofinance: reference/sources/yahoofinance.md
          - cointoss.sources.yf_schema: reference/sources/yf_schema.md
          - cointoss.sources.yf_models: reference/sources/yf_models.md
      - Serving:
          - cointoss.config: reference/config.md
          - cointoss.app: reference/app.md
          - cointoss.datasets: reference/datasets.md
          - cointoss.explorer: reference/explorer.md
          - cointoss.cli: reference/cli.md
  - Releases:
      - v0.0.3: release_notes/v0.0.3.md
      - v0.0.2: release_notes/v0.0.2.md
      - v0.0.1: release_notes/v0.0.1.md
      - "...": release_notes/index.md
  - Privacy: privacy.md
